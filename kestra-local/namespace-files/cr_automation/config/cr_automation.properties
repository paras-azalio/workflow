# CR_AUTOMATION project config (Kestra namespace file). It replaces the NEIs' mds.rc GRC sections.
# The flows copy the namespace files into the step's working folder; ${WORKDIR} is that folder.

# ---- FileCR NEI (macro_FILECR_ANY_V1.jar, run by the NEI component wrapper) ----
# GRC section "macro_FILECR_ANY_V1" - the wrapper writes the mds.rc from these lines
nei.filecr.grc.yaml_path=${WORKDIR}/templates/rules
nei.filecr.grc.jsonTemp_path=${WORKDIR}/templates/json
nei.filecr.grc.REPORT_TEMP_PATH=${WORKDIR}/templates/html
nei.filecr.grc.properties_path=${WORKDIR}/templates
nei.filecr.grc.moptemplates_path=${WORKDIR}/templates
# status-code tables (error_codes.txt, phase_codes.txt, supp_codes.txt) from the NEI package
nei.filecr.configdir=nei/filecr/config
nei.filecr.grc.execution_report_template_path=${WORKDIR}/templates/html/mop_execution_report_template.html
nei.filecr.grc.execution_summary_report_template_path=${WORKDIR}/templates/html/mop_execution_summary_report_template.html
nei.filecr.grc.single_node_execution_summary_report_template_path=${WORKDIR}/templates/html/mop_execution_single_node_report_template.html
# FileCR's login needs no parameters.

# ---- CLICR NEI (macro_CLICR_ANY_V1.jar): MOP_GENERATION and MOP_EXECUTION ----
# GRC section "macro_CLICR_ANY_V1". moptemplates_path holds yaml/<NODE_TYPE>_<ACTIVITY>.yaml (workflow) and
# jsonTemplate/<NODE_TYPE>_<ACTIVITY>_json-output.yaml (schema).
nei.clicr.grc.moptemplates_path=${WORKDIR}/templates/clicr
nei.clicr.grc.mop_summary_report_template_path=${WORKDIR}/templates/clicr/html/mop_summary_report_template_v2.html
nei.clicr.grc.mop_summary_report_template_path_v1=${WORKDIR}/templates/clicr/html/mop_summary_report_template.html
# Per environment (values below are local test placeholders): the NIAM / M2M jump host and the artefact repository the workflow YAMLs connect to.
# Secrets never go here: the flows pass them as environment variables from Kestra secrets -
#   NEI_GRC_REPO_PASSWORD   (GRC REPO_PASSWORD)     <- secret CLICR_REPO_PASSWORD
#   NEI_LOGIN_M2MPASSWORD1  (login M2MPASSWORD1)    <- secret CLICR_M2MPASSWORD1
nei.clicr.grc.NIAM_IP=127.0.0.1
nei.clicr.grc.M2MPORT=2222
nei.clicr.grc.REPO_IP=127.0.0.1
nei.clicr.grc.REPO_USER=installer
nei.clicr.login.M2MUSER1=m2madmin
nei.clicr.configdir=nei/clicr/config

# ---- FileCR GENERATE_REPORT (per-node failure report, per-CR summary, rollback summary) ----
nei.filecr.grc.execution_report_template_path=${WORKDIR}/templates/html/mop_execution_report_template.html
nei.filecr.grc.single_node_execution_summary_report_template_path=${WORKDIR}/templates/html/mop_execution_single_node_report_template.html
nei.filecr.grc.execution_summary_report_template_path=${WORKDIR}/templates/html/mop_execution_summary_report_template.html

# ---- Request store (bin/store.sh): tables request / request_step in schema cr_automation ----
# kestra-local: Kestra's own PostgreSQL database; the password is the Kestra secret CR_DB_PASSWORD.
store.jdbc.url=jdbc:postgresql://postgres:5432/kestra
store.jdbc.user=kestra

# ---- Rollback per activity: rollback.<NODE_TYPE>_<ACTIVITY>=true offers "rollback node" (MOP_EXECUTION with
# ROLLBACK_ONLY=true) for nodes whose execution ended with ROLLBACK_ENABLED=TRUE. Not set = no rollback.
# PGW 1051 has no rollback phase in its workflow.
rollback.PGW_RDS_1051_SUBSCRIBER_PROFILE_CONFIGURATION=false
