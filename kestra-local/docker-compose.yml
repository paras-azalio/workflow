# Local Kestra 2.0.7 + PostgreSQL for trying the cr_automation flows.
# Based on BST/kestra/docker-compose.yml (Kestra v2.0.7 source), with these changes:
#   - image built from ./Dockerfile: kestra/kestra:v2.0.7 (pinned - 2.x has breaking releases) plus a Java 8
#     runtime for the NEI jars (NEI_JAVA=/opt/java8/bin/java);
#   - basic auth switched on, credentials from .env (copy .env.example to .env);
#   - no Docker socket: our steps use the Process task runner, which runs commands inside the Kestra container;
#   - a shared-data volume mounted at /mnt/shared_data = the KV entry SHARED_DATA_DIR, BST's path (the CLICR
#     workflow YAMLs use /mnt/shared_data/<CHILD_REQ_ID>/ literally);
#   - Kestra OSS secrets as SECRET_<NAME> environment variables (base64), from .env.
# Start:  docker compose up -d      UI: http://localhost:8080
volumes:
  postgres-data:
  kestra-data:
  shared-data:

services:
  postgres:
    image: postgres:18
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-k3str4}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 10

  kestra:
    build: .
    image: cr-automation/kestra:v2.0.7-nei
    pull_policy: build   # local image: build it, never try to pull it
    stop_grace_period: 6m
    command: server standalone
    volumes:
      - kestra-data:/app/storage
      - shared-data:/mnt/shared_data
    environment:
      # Kestra OSS secrets: {{ secret('CLICR_REPO_PASSWORD') }} reads SECRET_CLICR_REPO_PASSWORD (base64)
      SECRET_CLICR_REPO_PASSWORD: ${SECRET_CLICR_REPO_PASSWORD:?set it in .env}
      SECRET_CLICR_M2MPASSWORD1: ${SECRET_CLICR_M2MPASSWORD1:?set it in .env}
      # request store (bin/store.sh): the PostgreSQL password, base64 - the same as POSTGRES_PASSWORD
      SECRET_CR_DB_PASSWORD: ${SECRET_CR_DB_PASSWORD:?set it in .env}
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: ${POSTGRES_PASSWORD:-k3str4}
        kestra:
          server:
            basic-auth:
              username: ${KESTRA_USER}
              password: ${KESTRA_PASSWORD}
          repository:
            type: postgres
          storage:
            type: local
            local:
              base-path: "/app/storage"
          queue:
            type: postgres
          url: http://localhost:8080/
    ports:
      - "8080:8080"
      # 8081 is the management port: unauthenticated, keep it closed.
    depends_on:
      postgres:
        condition: service_healthy
