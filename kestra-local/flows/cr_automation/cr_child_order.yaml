id: cr_child_order
namespace: cr_automation
description: |
  Child order (on demand): continues a VALIDATED order with ONE of its CRs. Pick the order in "order_id" and the CR
  in "cr_name" (the list shows the order's CR_LIST and the last child order of each CR). Run it again for the next CR.

  The child gets its own request id from the request store - the next whole number (e.g. order 1 -> child 2, or 3
  if 2 is taken): CHILD_REQ_ID, the label req_id and its folder <SHARED_DATA_DIR>/<child id>/, like
  /mnt/shared_data/<child request id>/ in BST. The order id is PARENT_REQ_ID. Every step is recorded in the
  store (table request_step) with its IO.

    MOP generation - CLICR MOP_GENERATION for the CR (CR_NAME): the MOP html in the child folder and
                     ACTIVITY_CR_NODE_NAMES, the nodes (zones) the CR runs on. Child stage MOP_GENERATED.

  MOP execution is a separate step: cr_mop_execution (or the child's "Order" tab), for some or all of the child's
  nodes, in parallel. Only when "run_execution" is ticked (off by default) this flow runs it for all nodes right
  after the MOP generation.

  The process decides whether this runs by itself for every CR once the CIQ is validated (the step's auto_start in
  the Process designer), and may attach an after_step pipeline: it runs right after the MOP generation, with its
  result as ${run.X} - e.g. a mail with the MOP to the CR's e-mail address.

  IO and MML logs: <child folder>/logs/ (also this execution's output files and the "IO / MML" tab).
  Secrets: Kestra secrets CLICR_REPO_PASSWORD (GRC REPO_PASSWORD), CR_DB_PASSWORD (request store).

labels:
  project: CR_AUTOMATION
  process: "true"   # a step of the order process: executors may start it (gateway rule)
  order_type: CHILD
  pipeline_hooks: "after_step"   # the process may attach a pipeline run right after the MOP generation
  outline: "MOP generation (CLICR) | after_step"   # what the process designer's Flow view draws (see cr_mop_execution)

inputs:
  - id: order_id
    type: SELECT
    expression: >-
      {{ (kv('ORDERS', errorOnMissing=false) ?? []) | jq('[.[] | select(.stage == "VALIDATED")]') | first }}
    description: Validated order to continue
  - id: cr_name
    type: SELECT
    dependsOn:
      inputs:
        - order_id
    expression: "{{ kv('ORDER_' ~ inputs.order_id).cr_options }}"
    description: CR of the order to run now (CR_NAME)
  - id: run_execution
    type: BOOL
    defaults: false
    description: Also execute the MOP on all its nodes right after generating it (off = generate the MOP only)

variables:
  child_id: "{{ outputs.allocate.vars.req_id ?? '' }}"
  order_dir: "{{ kv('SHARED_DATA_DIR') }}/{{ outputs.allocate.vars.req_id ?? '' }}"
  json_file: "{{ kv('ORDER_' ~ inputs.order_id).json_file }}"
  node_type: "{{ kv('ORDER_' ~ inputs.order_id).node_type }}"
  activity: "{{ kv('ORDER_' ~ inputs.order_id).activity }}"
  node_version: "{{ kv('ORDER_' ~ inputs.order_id).node_version }}"

tasks:
  - id: allocate
    type: io.kestra.plugin.scripts.shell.Commands
    description: This child in the request store - its request id (the next number) and its folder
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    namespaceFiles:
      enabled: true
      include: [bin/**, wrappers/**, lib/**, config/**]
    env:
      SHARED_DATA_DIR: "{{ kv('SHARED_DATA_DIR') }}"
      STORE_JDBC_PASSWORD: "{{ secret('CR_DB_PASSWORD') }}"
    commands:
      - >-
        sh bin/store.sh new-request --kind CHILD --parent "{{ inputs.order_id }}" --cr "{{ inputs.cr_name }}"
        --execution "{{ execution.id }}"

  - id: save_taken_ids
    type: io.kestra.plugin.core.kv.Set
    description: Request ids in use - what the order number check of the forms reads
    key: REQ_IDS_TAKEN
    kvType: JSON
    value: "{{ outputs.allocate.vars.taken | toJson }}"

  - id: set_labels
    type: io.kestra.plugin.core.execution.Labels
    labels:
      req_id: "{{ render(vars.child_id) }}"
      order_id: "{{ inputs.order_id }}"
      cr_name: "{{ inputs.cr_name }}"

  - id: register_start
    type: io.kestra.plugin.scripts.shell.Commands
    description: The order as the forms see it, now with this child (RUNNING)
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    namespaceFiles:
      enabled: true
      include: [bin/**, wrappers/**, lib/**, config/**]
    env:
      SHARED_DATA_DIR: "{{ kv('SHARED_DATA_DIR') }}"
      STORE_JDBC_PASSWORD: "{{ secret('CR_DB_PASSWORD') }}"
    commands:
      - sh bin/store.sh registry --order "{{ inputs.order_id }}"

  - id: save_order_start
    type: io.kestra.plugin.core.kv.Set
    key: "ORDER_{{ inputs.order_id }}"
    kvType: JSON
    value: "{{ outputs.register_start.vars.order | toJson }}"

  - id: mop_generation
    type: io.kestra.plugin.scripts.shell.Commands
    description: CLICR NEI, ACTION=MOP_GENERATION, CR_NAME=<this CR>
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    namespaceFiles:
      enabled: true
      include: [bin/**, wrappers/**, lib/**, nei/clicr/**, templates/clicr/**, config/**]
    outputFiles:
      - out/**
    env:
      ORDER_DIR: "{{ render(vars.order_dir) }}"
      NEI_GRC_REPO_PASSWORD: "{{ secret('CLICR_REPO_PASSWORD') }}"
      SHARED_DATA_DIR: "{{ kv('SHARED_DATA_DIR') }}"
      STORE_JDBC_PASSWORD: "{{ secret('CR_DB_PASSWORD') }}"
      STORE_REQ_ID: "{{ render(vars.child_id) }}"
      STORE_STEP: MOP_GENERATION
      EXECUTION_ID: "{{ execution.id }}"
    commands:
      - >-
        sh bin/nei.sh clicr mop_generation
        --param REQ_TYPE=1
        --param ACTION=MOP_GENERATION
        --param "JSON_FILE_NAME={{ render(vars.json_file) }}"
        --param "OUTPUT_FILE_LOCATION=$ORDER_DIR/"
        --param "OUTPUT_JSON_REPORT_LOCATION=$ORDER_DIR/REPORT"
        --param "CR_NAME={{ inputs.cr_name }}"
        --param "NODE_TYPE={{ render(vars.node_type) }}"
        --param "SUB_ACTIVITY_NAME={{ render(vars.activity) }}"
        --param "NODE_VERSION={{ render(vars.node_version) }}"
        --param "ORDER_NO={{ inputs.order_id }}"
        --param "PARENT_REQ_ID={{ inputs.order_id }}"
        --param "CHILD_REQ_ID={{ render(vars.child_id) }}"
        --param "REQ_ID={{ render(vars.child_id) }}"
      - cp "$ORDER_DIR"/*.html out/ 2>/dev/null || true

  - id: register_mop
    type: io.kestra.plugin.scripts.shell.Commands
    description: The child's stage (MOP_GENERATED or MOP_FAILED) and its nodes, for the forms and the "Order" tab
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    namespaceFiles:
      enabled: true
      include: [bin/**, wrappers/**, lib/**, config/**]
    env:
      SHARED_DATA_DIR: "{{ kv('SHARED_DATA_DIR') }}"
      STORE_JDBC_PASSWORD: "{{ secret('CR_DB_PASSWORD') }}"
    commands:
      - >-
        sh bin/store.sh set-stage --req-id "{{ render(vars.child_id) }}"
        --stage "{{ outputs.mop_generation.vars.status == 0 ? 'MOP_GENERATED' : 'MOP_FAILED' }}" > /dev/null
      - sh bin/store.sh registry --order "{{ inputs.order_id }}"

  - id: save_order_mop
    type: io.kestra.plugin.core.kv.Set
    key: "ORDER_{{ inputs.order_id }}"
    kvType: JSON
    value: "{{ outputs.register_mop.vars.order | toJson }}"

  - id: pipelines
    type: io.kestra.plugin.scripts.shell.Commands
    description: The pipeline the order's process version attaches to this flow (after_step), if any
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    namespaceFiles:
      enabled: true
      include: [bin/**, wrappers/**, lib/**, config/**]
    env:
      SHARED_DATA_DIR: "{{ kv('SHARED_DATA_DIR') }}"
      STORE_JDBC_PASSWORD: "{{ secret('CR_DB_PASSWORD') }}"
    commands:
      - sh bin/store.sh pipelines --req-id "{{ render(vars.child_id) }}" --flow "{{ flow.id }}"

  - id: after_step_pipeline
    type: io.kestra.plugin.core.flow.Subflow
    description: The process's pipeline after the MOP generation (e.g. the MOP mailed to the CR's address)
    runIf: "{{ outputs.pipelines.vars.after_step is not empty }}"
    namespace: "{{ flow.namespace }}"
    flowId: "{{ outputs.pipelines.vars.after_step }}"
    inputs:
      order_id: "{{ inputs.order_id }}"
      child_id: "{{ render(vars.child_id) }}"
      step: MOP_GENERATION
    labels:
      order_id: "{{ inputs.order_id }}"
      req_id: "{{ render(vars.child_id) }}"
    wait: true
    transmitFailed: true

  - id: mop_generation_failed
    type: io.kestra.plugin.core.execution.Fail
    runIf: "{{ outputs.mop_generation.vars.status != 0 }}"
    errorMessage: >-
      MOP generation failed for {{ inputs.cr_name }}: {{ outputs.mop_generation.vars.message }} - see
      logs/mop_generation.mml in {{ render(vars.order_dir) }}/

  - id: mop_ready
    type: io.kestra.plugin.core.log.Log
    message: >-
      Child {{ render(vars.child_id) }} ({{ inputs.cr_name }}): MOP {{ outputs.mop_generation.vars.results.ACTIVITY_CR_MOP }},
      nodes {{ outputs.mop_generation.vars.results.ACTIVITY_CR_NODE_NAMES }}
      {{ inputs.run_execution ? '- executing all nodes now (cr_mop_execution)' : '- execute it with cr_mop_execution or the Order tab of this child' }}

  - id: execution_stage
    type: io.kestra.plugin.core.flow.If
    condition: "{{ inputs.run_execution }}"
    then:
      - id: execute_all_nodes
        type: io.kestra.plugin.core.flow.Subflow
        description: The same MOP execution a user starts on demand, here for all nodes of the MOP
        namespace: "{{ flow.namespace }}"
        flowId: cr_mop_execution
        inputs:
          order_id: "{{ inputs.order_id }}"
          child_id: "{{ render(vars.child_id) }}"
          nodes: ["*"]
        wait: true
        transmitFailed: true

finally:
  - id: collect_logs
    type: io.kestra.plugin.scripts.shell.Commands
    description: The child's IO and MML logs, CLICR's LOGS and the reports as output files (the "IO / MML" tab)
    runIf: "{{ render(vars.child_id) is not empty }}"
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    outputFiles:
      - logs/**
      - LOGS/**
      - REPORT/**
    env:
      ORDER_DIR: "{{ render(vars.order_dir) }}"
    commands:
      - mkdir -p logs LOGS REPORT
      - cp "$ORDER_DIR"/logs/* logs/ 2>/dev/null || true
      - cp -r "$ORDER_DIR"/LOGS/* LOGS/ 2>/dev/null || true
      - cp -r "$ORDER_DIR"/REPORT/* REPORT/ 2>/dev/null || true

afterExecution:
  - id: register_end
    type: io.kestra.plugin.scripts.shell.Commands
    description: A child that ended before its MOP stage was recorded becomes FAILED, or STOPPED when it was killed
    runIf: "{{ render(vars.child_id) is not empty }}"
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    namespaceFiles:
      enabled: true
      include: [bin/**, wrappers/**, lib/**, config/**]
    env:
      SHARED_DATA_DIR: "{{ kv('SHARED_DATA_DIR') }}"
      STORE_JDBC_PASSWORD: "{{ secret('CR_DB_PASSWORD') }}"
      STATE: "{{ execution.state }}"
    commands:
      - >-
        sh bin/store.sh set-stage --req-id "{{ render(vars.child_id) }}" --if-stage RUNNING
        --stage "$( [ "$STATE" = KILLED ] || [ "$STATE" = KILLING ] && echo STOPPED || echo FAILED )" > /dev/null
      - sh bin/store.sh registry --order "{{ inputs.order_id }}"

  - id: save_order_end
    type: io.kestra.plugin.core.kv.Set
    runIf: "{{ render(vars.child_id) is not empty }}"
    key: "ORDER_{{ inputs.order_id }}"
    kvType: JSON
    value: "{{ outputs.register_end.vars.order | toJson }}"
