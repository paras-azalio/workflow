id: cr_mop_execution
namespace: cr_automation
description: |
  MOP execution of a child order (on demand): pick the order, the child (a CR whose MOP has been generated) and
  some or all of its nodes, and how they run: CONFIGURED (default - each node as the order's configuration levels
  say: execution settings of the node, the node type + sub-activity, the node type, the whole project; else
  parallel), PARALLEL (all chosen nodes at once) or QUEUED (one node after the other, in the order of the MOP);
  configured queued and parallel nodes run side by side. Each node is one execution of cr_mop_execution_node - CLICR MOP_EXECUTION
  (NODE_NAME) in its own process, then the failure report when it failed; a failed node never stops the others, and
  a queue goes on with the next node. Then the CR gets its summary report (FileCR GENERATE_REPORT over all node
  reports of the child). cr_child_order runs this flow for all nodes when "execute
  right after generating" is ticked.

  The nodes come from the child's own MOP generation (ACTIVITY_CR_NODE_NAMES in the request store) - nothing here
  is specific to an activity. A node runs under the child's request id (CHILD_REQ_ID, label req_id).

  Pipelines: when the order's process version attaches pipelines to this flow (process designer, step's
  "pipelines"), a node runs its "node" pipeline (a flow compiled at publish) instead of the MOP_EXECUTION,
  and the "after_nodes" pipeline runs once after the summary report. Without pipelines nothing changes.

  Concurrency: the chosen nodes are claimed in the request store first (all or none). A node another execution is
  running is refused, so a node never runs twice at the same time; other nodes of the same child can run in
  parallel executions. The summary report is written under a database lock per child. The locks are released
  when this execution ends, also when it fails or is killed; the child's stage (EXECUTING, SUCCESS, FAILED,
  PARTIAL) is then recomputed from all its nodes. Killed (Stop / Kill): the running nodes are killed with it, no
  summary report is made, the failure reports already written stay, and the child becomes STOPPED.

  IO and MML logs: <child folder>/logs/ (also this execution's output files and the "IO / MML" tab).
  Secrets: Kestra secrets CLICR_REPO_PASSWORD (GRC REPO_PASSWORD), CLICR_M2MPASSWORD1 (login M2MPASSWORD1),
  CR_DB_PASSWORD (request store).

labels:
  project: CR_AUTOMATION
  process: "true"   # a step of the order process: executors may start it (gateway rule)
  order_type: CHILD
  action: MOP_EXECUTION
  pipeline_hooks: "node,after_nodes"   # the pipelines a process step may attach to this flow
  # what the process designer's Flow view draws for this flow (| between boxes; @hook = a box that opens that
  # hook's drill-down; hook=text = the hook's default when no pipeline is set; ?text = an If whose TRUE runs the rest)
  outline: "@node Each node (parallel or queued) | Summary report (FileCR) | after_nodes"
  outline_node: "node=MOP execution (CLICR) | ?Node failed? | Failure report (FileCR)"

inputs:
  - id: order_id
    type: SELECT
    expression: >-
      {{ (kv('ORDERS', errorOnMissing=false) ?? []) | jq('[.[] | select(.stage == "VALIDATED")]') | first }}
    description: Validated order
  - id: child_id
    type: SELECT
    dependsOn:
      inputs: [order_id]
    expression: "{{ kv('ORDER_' ~ inputs.order_id).child_options }}"
    description: Child order (CR) whose MOP has been generated
  - id: nodes
    type: MULTISELECT
    dependsOn:
      inputs: [order_id, child_id]
    expression: "{{ kv('ORDER_' ~ inputs.order_id).children_by_id[inputs.child_id].node_options }}"
    description: Nodes to execute - "All nodes" or any of them (each with its current state)
  - id: mode
    type: SELECT
    values: [CONFIGURED, PARALLEL, QUEUED]
    defaults: CONFIGURED
    description: CONFIGURED - as the activity configuration says (else parallel); PARALLEL - all at once; QUEUED - one after the other

variables:
  child_id: "{{ inputs.child_id }}"
  order_dir: "{{ outputs.claim.vars.folder ?? '' }}"
  json_file: "{{ outputs.claim.vars.json_file ?? '' }}"
  cr_name: "{{ outputs.claim.vars.cr_name ?? '' }}"
  node_type: "{{ outputs.claim.vars.node_type ?? '' }}"
  activity: "{{ outputs.claim.vars.activity ?? '' }}"
  node_version: "{{ outputs.claim.vars.node_version ?? '' }}"

tasks:
  - id: set_labels
    type: io.kestra.plugin.core.execution.Labels
    labels:
      req_id: "{{ inputs.child_id }}"
      order_id: "{{ inputs.order_id }}"

  - id: claim
    type: io.kestra.plugin.scripts.shell.Commands
    description: Claims the chosen nodes of the child in the request store (all or none) and reads the child's data
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    namespaceFiles:
      enabled: true
      include: [bin/**, wrappers/**, lib/**, config/**]
    env:
      SHARED_DATA_DIR: "{{ kv('SHARED_DATA_DIR') }}"
      STORE_JDBC_PASSWORD: "{{ secret('CR_DB_PASSWORD') }}"
    commands:
      - >-
        sh bin/store.sh claim-nodes --req-id "{{ inputs.child_id }}" --nodes "{{ inputs.nodes | join(',') }}"
        --execution "{{ execution.id }}" --mode "{{ inputs.mode }}"

  - id: plan
    type: io.kestra.plugin.core.log.Log
    message: >-
      Mode {{ inputs.mode }} - parallel: {{ outputs.claim.vars.parallel_nodes | join(', ') }} -
      queued: {{ outputs.claim.vars.queued_nodes | join(', ') }}

  - id: pipelines
    type: io.kestra.plugin.scripts.shell.Commands
    description: The pipeline flows the order's process version attaches to this flow ("" = none)
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    namespaceFiles:
      enabled: true
      include: [bin/**, wrappers/**, lib/**, config/**]
    env:
      SHARED_DATA_DIR: "{{ kv('SHARED_DATA_DIR') }}"
      STORE_JDBC_PASSWORD: "{{ secret('CR_DB_PASSWORD') }}"
    commands:
      - sh bin/store.sh pipelines --req-id "{{ inputs.child_id }}" --flow "{{ flow.id }}"

  - id: set_cr_label
    type: io.kestra.plugin.core.execution.Labels
    labels:
      cr_name: "{{ render(vars.cr_name) }}"

  - id: publish_running
    type: io.kestra.plugin.scripts.shell.Commands
    description: The child as EXECUTING and its claimed nodes as RUNNING, for the forms and the "Order" tab
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    namespaceFiles:
      enabled: true
      include: [bin/**, wrappers/**, lib/**, config/**]
    env:
      SHARED_DATA_DIR: "{{ kv('SHARED_DATA_DIR') }}"
      STORE_JDBC_PASSWORD: "{{ secret('CR_DB_PASSWORD') }}"
    commands:
      - sh bin/store.sh child-status --req-id "{{ inputs.child_id }}" --update-stage > /dev/null
      - sh bin/store.sh registry --order "{{ inputs.order_id }}"

  - id: save_order_running
    type: io.kestra.plugin.core.kv.Set
    key: "ORDER_{{ inputs.order_id }}"
    kvType: JSON
    value: "{{ outputs.publish_running.vars.order | toJson }}"

  - id: run_nodes
    type: io.kestra.plugin.core.flow.Parallel
    description: The parallel group (all at once) and the queued group (one after the other) side by side
    tasks:
      - id: parallel_group
        type: io.kestra.plugin.core.flow.If
        condition: "{{ (outputs.claim.vars.parallel_nodes | length) > 0 }}"
        then:
          - id: nodes
            type: io.kestra.plugin.core.flow.Loop
            values: "{{ outputs.claim.vars.parallel_nodes | toJson }}"
            concurrencyLimit: 0
            tasks:
              - id: node
                type: io.kestra.plugin.core.flow.Subflow
                description: The node (cr_mop_execution_node) - its failure is recorded, not passed on
                namespace: "{{ flow.namespace }}"
                flowId: cr_mop_execution_node
                inputs:
                  order_id: "{{ inputs.order_id }}"
                  child_id: "{{ inputs.child_id }}"
                  node: "{{ item.value | trim }}"
                  pipeline: "{{ outputs.pipelines.vars.node }}"
                  folder: "{{ render(vars.order_dir) }}"
                  json_file: "{{ render(vars.json_file) }}"
                  cr_name: "{{ render(vars.cr_name) }}"
                  node_type: "{{ render(vars.node_type) }}"
                  activity: "{{ render(vars.activity) }}"
                  node_version: "{{ render(vars.node_version) }}"
                labels:
                  order_id: "{{ inputs.order_id }}"
                  req_id: "{{ inputs.child_id }}"
                  node: "{{ item.value | trim }}"
                wait: true
                transmitFailed: false
      - id: queued_group
        type: io.kestra.plugin.core.flow.If
        condition: "{{ (outputs.claim.vars.queued_nodes | length) > 0 }}"
        then:
          - id: nodes_queued
            type: io.kestra.plugin.core.flow.Loop
            values: "{{ outputs.claim.vars.queued_nodes | toJson }}"
            concurrencyLimit: 1
            tasks:
              - id: node_queued
                type: io.kestra.plugin.core.flow.Subflow
                description: The node (cr_mop_execution_node) - its failure is recorded, not passed on
                namespace: "{{ flow.namespace }}"
                flowId: cr_mop_execution_node
                inputs:
                  order_id: "{{ inputs.order_id }}"
                  child_id: "{{ inputs.child_id }}"
                  node: "{{ item.value | trim }}"
                  pipeline: "{{ outputs.pipelines.vars.node }}"
                  folder: "{{ render(vars.order_dir) }}"
                  json_file: "{{ render(vars.json_file) }}"
                  cr_name: "{{ render(vars.cr_name) }}"
                  node_type: "{{ render(vars.node_type) }}"
                  activity: "{{ render(vars.activity) }}"
                  node_version: "{{ render(vars.node_version) }}"
                labels:
                  order_id: "{{ inputs.order_id }}"
                  req_id: "{{ inputs.child_id }}"
                  node: "{{ item.value | trim }}"
                wait: true
                transmitFailed: false

  - id: summary_report
    type: io.kestra.plugin.scripts.shell.Commands
    description: FileCR NEI, ACTION=GENERATE_REPORT - the CR's summary over all its node reports (one writer per child)
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    namespaceFiles:
      enabled: true
      include: [bin/**, wrappers/**, lib/**, nei/filecr/**, templates/**, config/**]
    outputFiles:
      - out/**
    env:
      ORDER_DIR: "{{ render(vars.order_dir) }}"
      SHARED_DATA_DIR: "{{ kv('SHARED_DATA_DIR') }}"
      STORE_JDBC_PASSWORD: "{{ secret('CR_DB_PASSWORD') }}"
      STORE_REQ_ID: "{{ inputs.child_id }}"
      STORE_STEP: SUMMARY_REPORT
      EXECUTION_ID: "{{ execution.id }}"
    commands:
      - >-
        sh bin/store.sh locked --key "summary_report:{{ inputs.child_id }}" --
        sh bin/nei.sh filecr summary_report
        --param REQ_TYPE=1
        --param ACTION=GENERATE_REPORT
        --param "CR_NAME={{ render(vars.cr_name) }}"
        --param "NODE_TYPE={{ render(vars.node_type) }}"
        --param "SUB_ACTIVITY_NAME={{ render(vars.activity) }}"
        --param "OUTPUT_REPORT_LOCATION=$ORDER_DIR/REPORT"
        --param "PARENT_REQ_ID={{ inputs.order_id }}"
        --param "CHILD_REQ_ID={{ inputs.child_id }}"
        --param "REQ_ID={{ inputs.child_id }}"

  - id: after_nodes_pipeline
    type: io.kestra.plugin.core.flow.Subflow
    description: The pipeline from the process designer that runs once after all nodes (e.g. a post-completion)
    runIf: "{{ outputs.pipelines.vars.after_nodes is not empty }}"
    namespace: "{{ flow.namespace }}"
    flowId: "{{ outputs.pipelines.vars.after_nodes }}"
    inputs:
      order_id: "{{ inputs.order_id }}"
      child_id: "{{ inputs.child_id }}"
      nodes: "{{ outputs.claim.vars.nodes | join(',') }}"
    labels:
      order_id: "{{ inputs.order_id }}"
      req_id: "{{ inputs.child_id }}"
    wait: true
    transmitFailed: true

  - id: run_result
    type: io.kestra.plugin.scripts.shell.Commands
    description: From the request store - which of this execution's nodes failed (latest MOP_EXECUTION per node)
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    namespaceFiles:
      enabled: true
      include: [bin/**, wrappers/**, lib/**, config/**]
    env:
      SHARED_DATA_DIR: "{{ kv('SHARED_DATA_DIR') }}"
      STORE_JDBC_PASSWORD: "{{ secret('CR_DB_PASSWORD') }}"
    commands:
      - >-
        sh bin/store.sh child-status --req-id "{{ inputs.child_id }}"
        --nodes "{{ outputs.claim.vars.nodes | join(',') }}"

  - id: nodes_failed
    type: io.kestra.plugin.core.execution.Fail
    runIf: "{{ outputs.run_result.vars.failed_count > 0 }}"
    errorMessage: >-
      MOP execution failed on {{ outputs.run_result.vars.failed_count }} of
      {{ outputs.run_result.vars.nodes | length }} node(s) (child {{ inputs.child_id }}, {{ render(vars.cr_name) }}):
      {{ outputs.run_result.vars.failed_nodes | join(', ') }} - see the failure reports and the summary in
      {{ render(vars.order_dir) }}/REPORT/

finally:
  - id: collect_logs
    type: io.kestra.plugin.scripts.shell.Commands
    description: The child's IO and MML logs, CLICR's LOGS and the reports as output files (the "IO / MML" tab)
    runIf: "{{ render(vars.order_dir) is not empty }}"
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    outputFiles:
      - logs/**
      - LOGS/**
      - REPORT/**
    env:
      ORDER_DIR: "{{ render(vars.order_dir) }}"
    commands:
      - mkdir -p logs LOGS REPORT
      - cp "$ORDER_DIR"/logs/* logs/ 2>/dev/null || true
      - cp -r "$ORDER_DIR"/LOGS/* LOGS/ 2>/dev/null || true
      - cp -r "$ORDER_DIR"/REPORT/* REPORT/ 2>/dev/null || true

afterExecution:
  - id: register_end
    type: io.kestra.plugin.scripts.shell.Commands
    description: Releases this execution's nodes (also after a failure or kill), recomputes the child's stage (STOPPED when killed), publishes the order
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    namespaceFiles:
      enabled: true
      include: [bin/**, wrappers/**, lib/**, config/**]
    env:
      SHARED_DATA_DIR: "{{ kv('SHARED_DATA_DIR') }}"
      STORE_JDBC_PASSWORD: "{{ secret('CR_DB_PASSWORD') }}"
      STATE: "{{ execution.state }}"
    commands:
      - sh bin/store.sh release-nodes --req-id "{{ inputs.child_id }}" --execution "{{ execution.id }}" > /dev/null
      - sh bin/store.sh child-status --req-id "{{ inputs.child_id }}" --update-stage > /dev/null
      - >-
        if [ "$STATE" = KILLED ] || [ "$STATE" = KILLING ]; then
        sh bin/store.sh set-stage --req-id "{{ inputs.child_id }}" --stage STOPPED > /dev/null; fi
      - sh bin/store.sh registry --order "{{ inputs.order_id }}"

  - id: save_order_end
    type: io.kestra.plugin.core.kv.Set
    key: "ORDER_{{ inputs.order_id }}"
    kvType: JSON
    value: "{{ outputs.register_end.vars.order | toJson }}"
